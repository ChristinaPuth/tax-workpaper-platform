# fly.toml app configuration file generated for tax-workpaper on 2026-10-26T20:52:29-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tax-workpaper'
primary_region = 'sjc'

[build]
[env]
  PORT = '8000'
  SANDBOX_PER_VISITOR = '1'  # public demo: each browser tab gets its own copy (app/sandbox.py)

[[mounts]]
  source = 'workpaper_data'
  destination = '/app/var'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/overview'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
